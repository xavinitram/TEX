name: Nightly differential fuzz
# TST-1 durability engine at scale (audit #2): the fast suite runs the fuzzer at
# N=300 with a FIXED seed (reproducible); this nightly widens it to N=2000 with a
# date-derived seed so the grammar explores new programs each night. A divergence
# here is a real interp↔codegen bug to triage into a permanent test_codegen_
# equivalence row.
on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Wide differential fuzz (N=2000, date-seeded)
    runs-on: ubuntu-latest
    steps:
      # Check out INTO a `TEX_Wrangle/` dir so the package imports as `TEX_Wrangle`.
      # The GitHub repo is named `TEX`; without `path:` the checkout dir is `TEX` and
      # `from TEX_Wrangle...` -> ModuleNotFoundError (the failure this fixes). Mirrors
      # tests.yml, which already does this and passes.
      - uses: actions/checkout@v4
        with:
          path: TEX_Wrangle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - name: Fuzz
        working-directory: TEX_Wrangle
        run: |
          export TEX_FUZZ_N=2000
          export TEX_FUZZ_SEED=$(date +%Y%m%d)
          python -m pytest tests/test_v017_phase1.py -k differential_fuzzer -v
      # ROI-4's differential lane is the OTHER durability oracle, and v0.30's ROI flag flip
      # is gated on it being green ON A NIGHTLY RUN (docs/roi-spatial-laziness.md, "The gate
      # that would change the verdict"). It only ever ran in the fast per-PR suite, so the
      # gate had no nightly to be green on — this closes that gap. Same date seed, so a
      # failure is reproducible from the run's own log; a separate step so the log names
      # which oracle broke.
      - name: ROI differential oracle (ROI-4, the flag-flip gate)
        working-directory: TEX_Wrangle
        run: |
          # The ROI oracle reads its OWN env vars (TEX_ROI_FUZZ_SEED / TEX_ROI_FUZZ_N) — not
          # the TST-1 lane's TEX_FUZZ_* — so exporting the wrong names left this step running
          # the same 40 default programs every night, i.e. adding nothing over the per-PR
          # suite. A date seed is what makes "green across a nightly run" mean new coverage.
          export TEX_ROI_FUZZ_SEED=$(date +%Y%m%d)
          export TEX_ROI_FUZZ_N=400
          # Select on "roi4" alone, so EVERY ROI-4 test runs — present and future. Naming them
          # in an explicit or-list looked more precise and silently ran 4 of the 5:
          # test_roi4_partial_broadcast_crop matched none of the four terms and never ran.
          python -m pytest tests/test_v024_phase1.py -v -k "roi4"
